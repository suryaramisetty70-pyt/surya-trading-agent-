name: Auto-Scaling Universe & Auto-Training Pipeline

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (free-tier cron)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub UI

jobs:
  auto_train_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-Sync Symbol Universe & Master Lists
        run: |
          python ticker_universe.py

      - name: Run Auto-Training Pipeline & Validation Gate
        run: |
          python ml_pipeline.py

      - name: Commit Updated Ticker DB & Model Registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ticker_universe.db models/
          git commit -m "auto: weekly ticker universe refresh & model retraining [skip ci]" || echo "No changes to commit"
          git push origin main
