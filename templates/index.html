<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Indian Stock Intelligence Platform | Studio View</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Top Header Navigation */
        header {
            background: #1e293b;
            border-bottom: 1px solid var(--card-border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .badge-completed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container */
        .container {
            max-width: 1180px;
            margin: 24px auto;
            padding: 0 20px;
        }

        /* Search Card */
        .search-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .input-text {
            flex: 2;
            min-width: 240px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-text:focus {
            border-color: var(--accent-cyan);
        }

        .select-lang {
            flex: 1;
            min-width: 150px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .btn-action {
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #2563eb;
        }

        .btn-run {
            background: var(--accent-green);
        }

        .btn-run:hover {
            background: #059669;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: var(--text-sub);
        }

        .chip {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 14px;
            cursor: pointer;
        }

        .chip:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Live Data Brief Box */
        .live-data-box {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            line-height: 1.6;
            color: #38bdf8;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Studio Multi-Tab Output Card */
        .studio-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
        }

        /* Tabs Header */
        .studio-tabs {
            display: flex;
            background: #0f172a;
            border-bottom: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .tab-btn {
            padding: 14px 22px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-btn.active {
            color: var(--accent-cyan);
            border-bottom-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.05);
        }

        /* Tab Content Area */
        .tab-content-panel {
            padding: 28px;
            min-height: 400px;
            background: #ffffff;
            color: #0f172a;
        }

        /* Rendered Markdown Styling inside Light Content Panel */
        .markdown-body {
            line-height: 1.75;
            font-size: 0.95rem;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            color: #0f172a;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .markdown-body h1 {
            font-size: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            color: #1e293b;
        }

        .markdown-body h2 {
            font-size: 1.2rem;
            color: #2563eb;
        }

        .markdown-body ul, .markdown-body ol {
            margin-left: 20px;
            margin-bottom: 14px;
        }

        .markdown-body li {
            margin-bottom: 6px;
        }

        .markdown-body strong {
            color: #0f172a;
        }

        /* Download Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .toolbar-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
        }

        .loader-spinner {
            border: 3px solid #334155;
            border-top: 3px solid var(--accent-green);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-chart-pie" style="color: var(--accent-cyan);"></i>
            <span>Perfect Indian Stock Intelligence Platform</span>
        </div>
        <div class="badge-completed">
            <i class="fa-solid fa-bolt" style="color: #f59e0b;"></i>
            <span>Groq Llama 3.3 70B AI Active (Ultra-Fast)</span>
        </div>
    </header>

    <div class="container">

        <!-- Search Controls -->
        <div class="search-panel">
            <div class="search-row">
                <input type="text" id="tickerInput" class="input-text" placeholder="e.g. RELIANCE, TCS, INFY, SBIN, HDFCBANK, TATAMOTORS..." value="RELIANCE">
                
                <select id="languageSelect" class="select-lang">
                    <option value="English">🌐 English</option>
                    <option value="Telugu">తెలుగు (Telugu)</option>
                    <option value="Hindi">हिंदी (Hindi)</option>
                    <option value="Tamil">தமிழ் (Tamil)</option>
                </select>

                <button class="btn-action" onclick="fetchLiveStockData()">
                    <i class="fa-solid fa-bolt"></i> Live Data
                </button>
                <button class="btn-action btn-run" onclick="runCrewAIAnalysis()">
                    <i class="fa-solid fa-circle-play"></i> Run AI Analysis
                </button>
            </div>
            <div class="quick-chips">
                <span>Quick Select:</span>
                <span class="chip" onclick="selectTicker('RELIANCE')">RELIANCE</span>
                <span class="chip" onclick="selectTicker('TCS')">TCS</span>
                <span class="chip" onclick="selectTicker('INFY')">INFY</span>
                <span class="chip" onclick="selectTicker('HDFCBANK')">HDFCBANK</span>
                <span class="chip" onclick="selectTicker('SBIN')">SBIN</span>
                <span class="chip" onclick="selectTicker('ICICIBANK')">ICICIBANK</span>
            </div>
        </div>

        <!-- Live Real-Time Brief Data Card -->
        <div class="live-data-box" id="rawDataBox">
            Fetching verified real-time NSE/BSE stock data...
        </div>

        <!-- Loading Indicator -->
        <div id="loadingBox" style="display: none; padding: 20px; text-align: center; background: var(--card-bg); border-radius: 12px; margin-bottom: 24px;">
            <span class="loader-spinner"></span>
            <span style="margin-left: 10px; font-weight: 600; color: var(--accent-cyan);">Executing CrewAI Multi-Agent Pipeline with Groq Llama 3.3 70B...</span>
        </div>

        <!-- Studio Multi-Tab Output Interface (CrewAI Studio Style) -->
        <div class="studio-card" id="studioCard" style="display: none;">
            
            <div class="studio-tabs">
                <button class="tab-btn active" onclick="switchTab('masterTab', this)">
                    <i class="fa-solid fa-award"></i> Master Investment Report
                </button>
                <button class="tab-btn" onclick="switchTab('marketTab', this)">
                    <i class="fa-solid fa-chart-line"></i> Real-Time Market Dashboard
                </button>
                <button class="tab-btn" onclick="switchTab('fundamentalTab', this)">
                    <i class="fa-solid fa-building-columns"></i> Fundamental Stock Analysis
                </button>
                <button class="tab-btn" onclick="switchTab('technicalTab', this)">
                    <i class="fa-solid fa-chart-candlestick"></i> Technical Analysis Report
                </button>
            </div>

            <!-- Download Bar -->
            <div class="toolbar">
                <span class="toolbar-title"><i class="fa-solid fa-check-circle" style="color: var(--accent-green);"></i> Output Completed</span>
                <button class="btn-action" style="padding: 6px 14px; font-size: 0.82rem; background: #10b981;" onclick="downloadReportMD()">
                    <i class="fa-solid fa-download"></i> Download Report (.md)
                </button>
            </div>

            <div class="tab-content-panel">
                <div id="masterTab" class="tab-pane markdown-body"></div>
                <div id="marketTab" class="tab-pane markdown-body" style="display: none;"></div>
                <div id="fundamentalTab" class="tab-pane markdown-body" style="display: none;"></div>
                <div id="technicalTab" class="tab-pane markdown-body" style="display: none;"></div>
            </div>

        </div>

    </div>

    <script>
        let reportData = { master: '', market: '', fundamental: '', technical: '' };

        function selectTicker(ticker) {
            document.getElementById('tickerInput').value = ticker;
            fetchLiveStockData();
        }

        async function fetchLiveStockData() {
            const ticker = document.getElementById('tickerInput').value.trim() || 'RELIANCE';
            const rawBox = document.getElementById('rawDataBox');
            rawBox.style.whiteSpace = 'pre';
            rawBox.style.fontFamily = 'monospace';
            rawBox.innerHTML = `Fetching live data for ${ticker} from NSE India + Google Finance...\nPlease wait...`;

            try {
                const res = await fetch(`/api/stock-data?ticker=${encodeURIComponent(ticker)}`);
                const resp = await res.json();
                if (resp.status === 'success' && resp.data) {
                    rawBox.innerHTML = resp.data.raw_output || JSON.stringify(resp.data, null, 2);
                } else {
                    rawBox.innerHTML = `Error: ${resp.message || 'No data received for ' + ticker}`;
                }
            } catch (err) {
                rawBox.innerHTML = `Error fetching live stock data: ${err.message}`;
            }
        }

        async function runCrewAIAnalysis() {
            const ticker = document.getElementById('tickerInput').value.trim() || 'RELIANCE';
            const language = document.getElementById('languageSelect').value;
            const loadingBox = document.getElementById('loadingBox');
            const studioCard = document.getElementById('studioCard');

            loadingBox.style.display = 'block';
            studioCard.style.display = 'none';

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker: ticker, language: language })
                });
                const data = await res.json();

                loadingBox.style.display = 'none';
                if (data.status === 'success') {
                    reportData.master = data.master_report || '';
                    reportData.market = data.dashboard_report || '';
                    reportData.fundamental = data.fundamental_report || '';
                    reportData.technical = data.technical_report || '';

                    document.getElementById('masterTab').innerHTML = marked.parse(reportData.master);
                    document.getElementById('marketTab').innerHTML = marked.parse(reportData.market);
                    document.getElementById('fundamentalTab').innerHTML = marked.parse(reportData.fundamental);
                    document.getElementById('technicalTab').innerHTML = marked.parse(reportData.technical);

                    studioCard.style.display = 'block';
                    studioCard.scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert(`Error running AI analysis: ${data.message}`);
                }
            } catch (err) {
                loadingBox.style.display = 'none';
                alert(`Network error: ${err.message}`);
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        function downloadReportMD() {
            if (!reportData.master) {
                alert('No report available to download yet.');
                return;
            }
            const ticker = document.getElementById('tickerInput').value.trim() || 'RELIANCE';
            const blob = new Blob([reportData.master], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `${ticker}_Master_Trading_Report.md`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Fetch default stock data on load
        window.addEventListener('DOMContentLoaded', () => {
            fetchLiveStockData();
        });
    </script>
</body>
</html>
