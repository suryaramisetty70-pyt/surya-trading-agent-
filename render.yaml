services:
  - type: web
    name: max-market
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npx --yes bun@1.3.11 install --frozen-lockfile && npm run build
    startCommand: gunicorn --workers 1 --threads 4 app:app
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
