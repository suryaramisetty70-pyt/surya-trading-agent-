[project]
name = "perfect_indian_stock_intelligence_platform"
version = "0.1.0"
description = "perfect_indian_stock_intelligence_platform using crewAI with Groq"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai>=1.15.5,<2.0.0",
    "crewai-tools>=0.45.0",
    "groq>=0.9.0",
    "litellm>=1.0.0",
    "yfinance>=0.2.38",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckduckgo-search>=5.0.0",
    "flask>=3.1.3",
    "wikipedia>=1.4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
perfect_indian_stock_intelligence_platform = "perfect_indian_stock_intelligence_platform.main:run"
run_crew = "perfect_indian_stock_intelligence_platform.main:run"
train = "perfect_indian_stock_intelligence_platform.main:train"
replay = "perfect_indian_stock_intelligence_platform.main:replay"
test = "perfect_indian_stock_intelligence_platform.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
